# @package training

_target_: src.train.trainer.ContrastiveTrainer

epochs: 100
learning_rate: 0.0001
weight_decay: 0.0001
optimizer: "adam"
scheduler: "cosine"
warmup_epochs: 10
gradient_clip_norm: 1.0
accumulate_grad_batches: 1
precision: "16-mixed"
compile_model: false

# Loss function
loss:
  _target_: src.losses.contrastive.NTXentLoss
  temperature: 0.5
  normalize: true

# Validation
validate_every_n_epochs: 5
save_top_k: 3
